name: CI Quality Gate

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: |
          node --check public/gwaCalculator.js
          node --check public/app.js

      - name: Run unit tests
        run: node --test tests/